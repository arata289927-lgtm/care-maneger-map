<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1976d2">
<title>ケアマネ間取り図</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;background:#f4f7fb;color:#222}
header{background:#1976d2;color:#fff;padding:12px 16px;font-weight:700;font-size:20px}
.toolbar{padding:10px;display:flex;gap:7px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
button,select{border:0;border-radius:9px;padding:10px 12px;font-size:15px;background:#e9eef5;cursor:pointer}
button.active{background:#1976d2;color:#fff}
button.danger{background:#ffe8e8;color:#b00020}
button.save{background:#e7f5ea;color:#126b2e}
.help{padding:8px 12px;font-size:13px;color:#555;background:#fff;border-bottom:1px solid #e5e5e5}
#wrap{padding:10px;overflow:auto}
canvas{display:block;background:#fff;border:1px solid #bbb;touch-action:none;box-shadow:0 2px 8px #0001;max-width:none}
.note{padding:4px 12px 12px;font-size:12px;color:#666}
.group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.label{font-size:12px;color:#555;padding:0 2px}
@media(max-width:700px){
  header{font-size:18px}
  button,select{font-size:14px;padding:9px 10px}
  .toolbar{gap:5px}
}
</style>
</head>
<body>
<header>ケアマネ間取り図</header>

<div class="toolbar">
  <div class="group">
    <span class="label">描く</span>
    <button id="roomBtn" class="active" onclick="setMode('room')">部屋</button>
    <button onclick="setMode('line')">壁・線</button>
    <button onclick="setMode('door')">ドア</button>
    <button onclick="setMode('window')">窓</button>
  </div>

  <div class="group">
    <span class="label">置く</span>
    <select id="itemSelect" onchange="setItem(this.value)">
      <option value="">設備を選ぶ</option>
      <option>玄関</option>
      <option>トイレ</option>
      <option>浴室</option>
      <option>洗面</option>
      <option>台所</option>
      <option>居室</option>
      <option>寝室</option>
      <option>ベッド</option>
      <option>手すり</option>
      <option>段差</option>
      <option>階段</option>
      <option>車いす</option>
      <option>歩行器</option>
    </select>
    <button onclick="setMode('text')">文字</button>
    <button onclick="setMode('select')">移動</button>
    <button onclick="deleteSelected()">選択削除</button>
  </div>

  <div class="group">
    <button onclick="undo()">1つ戻す</button>
    <button class="save" onclick="saveImage()">画像保存</button>
    <button class="danger" onclick="clearAll()">全消去</button>
  </div>
</div>

<div class="help" id="help">
「部屋」→ 始点から終点までドラッグして四角を作成。設備は選んでから置きたい場所をタップしてください。
</div>

<div id="wrap"><canvas id="c" width="1000" height="700"></canvas></div>
<div class="note">※ 利用者名など個人情報を入れた画像の取り扱いには十分ご注意ください。</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const help = document.getElementById('help');

let mode='room', selectedItem='', start=null, temp=null;
let actions=[];
let selectedIndex=-1, dragOffset=null;

function setMode(m){
  mode=m; selectedItem='';
  document.getElementById('itemSelect').value='';
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  if(m==='room') document.getElementById('roomBtn').classList.add('active');
  const map={
    room:'ドラッグして部屋の四角を作ります。',
    line:'ドラッグして壁・線を引きます。',
    door:'ドラッグしてドアを配置します。',
    window:'ドラッグして窓を配置します。',
    text:'置きたい場所をタップして文字を入力します。',
    select:'設備や文字をクリックして選択し、そのままドラッグして移動できます。'
  };
  help.textContent=map[m]||'';
}

function setItem(v){
  if(!v) return;
  mode='item'; selectedItem=v;
  help.textContent=`「${v}」を置きたい場所をタップしてください。`;
}

function pos(e){
  const r=c.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {
    x:(p.clientX-r.left)*(c.width/r.width),
    y:(p.clientY-r.top)*(c.height/r.height)
  };
}

function snap(v){ return Math.round(v/25)*25; }
function sp(e){ const p=pos(e); return {x:snap(p.x),y:snap(p.y)}; }

function down(e){
  e.preventDefault();
  const p=sp(e);
  if(mode==='select'){
    selectedIndex=hitTest(p);
    if(selectedIndex>=0){
      const a=actions[selectedIndex];
      if(a.x!==undefined) dragOffset={x:p.x-a.x,y:p.y-a.y};
    } else dragOffset=null;
    draw(); return;
  }
  if(mode==='item'){
    actions.push({type:'item',x:p.x,y:p.y,text:selectedItem});
    draw(); return;
  }
  if(mode==='text'){
    const t=prompt('文字を入力してください');
    if(t){ actions.push({type:'text',x:p.x,y:p.y,text:t}); draw(); }
    return;
  }
  start=p; temp=p;
}

function move(e){
  e.preventDefault();
  const p=sp(e);
  if(mode==='select' && selectedIndex>=0 && dragOffset){
    const a=actions[selectedIndex];
    if(a.x!==undefined){ a.x=p.x-dragOffset.x; a.y=p.y-dragOffset.y; draw(); }
    return;
  }
  if(!start) return;
  temp=p; draw();
  drawPreview(start,temp);
}

function up(e){
  if(mode==='select'){ dragOffset=null; return; }
  if(!start) return;
  e.preventDefault();
  const end=sp(e);
  actions.push({type:mode,x1:start.x,y1:start.y,x2:end.x,y2:end.y});
  start=null; temp=null; draw();
}

c.addEventListener('mousedown',down);
c.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
c.addEventListener('touchstart',down,{passive:false});
c.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up,{passive:false});

function drawGrid(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.lineWidth=1; ctx.strokeStyle='#edf1f5';
  for(let x=0;x<=c.width;x+=25){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<=c.height;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
  ctx.strokeStyle='#d7dde5';
  for(let x=0;x<=c.width;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<=c.height;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
}

function draw(){
  drawGrid();
  actions.forEach((a,i)=>{ drawAction(a); if(i===selectedIndex) drawSelection(a); });
}

function drawAction(a){
  ctx.save();
  ctx.strokeStyle='#222'; ctx.fillStyle='#222'; ctx.lineWidth=4; ctx.font='18px sans-serif';
  if(a.type==='room'){
    const x=Math.min(a.x1,a.x2), y=Math.min(a.y1,a.y2);
    const w=Math.abs(a.x2-a.x1), h=Math.abs(a.y2-a.y1);
    ctx.strokeRect(x,y,w,h);
  }else if(a.type==='line'){
    ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();
  }else if(a.type==='door'){
    drawDoor(a.x1,a.y1,a.x2,a.y2);
  }else if(a.type==='window'){
    drawWindow(a.x1,a.y1,a.x2,a.y2);
  }else if(a.type==='text'){
    ctx.fillText(a.text,a.x,a.y);
  }else if(a.type==='item'){
    drawItem(a.text,a.x,a.y);
  }
  ctx.restore();
}

function drawDoor(x1,y1,x2,y2){
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const r=Math.hypot(x2-x1,y2-y1);
  if(r<5) return;
  const ang=Math.atan2(y2-y1,x2-x1);
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x1,y1,r,ang,ang+Math.PI/2,false);
  ctx.stroke();
}

function drawWindow(x1,y1,x2,y2){
  ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}

function drawItem(text,x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle='#222'; ctx.fillStyle='#fff'; ctx.lineWidth=2;
  ctx.font='14px sans-serif'; ctx.textAlign='center';

  if(text==='トイレ'){
    ctx.beginPath(); ctx.ellipse(0,5,15,20,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeRect(-13,-24,26,13);
    ctx.fillStyle='#222'; ctx.fillText('WC',0,38);
  }else if(text==='浴室'){
    ctx.strokeRect(-34,-22,68,44);
    ctx.beginPath(); ctx.roundRect(-25,-14,50,28,10); ctx.stroke();
    ctx.fillStyle='#222'; ctx.fillText('浴室',0,39);
  }else if(text==='洗面'){
    ctx.strokeRect(-25,-20,50,40);
    ctx.beginPath(); ctx.ellipse(0,0,16,10,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#222'; ctx.fillText('洗面',0,37);
  }else if(text==='台所'){
    ctx.strokeRect(-38,-18,76,36);
    ctx.beginPath();ctx.arc(-17,0,8,0,Math.PI*2);ctx.stroke();
    ctx.strokeRect(7,-9,20,18);
    ctx.fillStyle='#222';ctx.fillText('台所',0,36);
  }else if(text==='玄関'){
    ctx.beginPath();ctx.moveTo(-35,18);ctx.lineTo(35,18);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-25,18);ctx.lineTo(-25,-22);ctx.lineTo(15,-22);ctx.stroke();
    ctx.fillStyle='#222';ctx.fillText('玄関',0,39);
  }else if(text==='ベッド'){
    ctx.strokeRect(-38,-22,76,44); ctx.strokeRect(-32,-17,24,16);
    ctx.fillStyle='#222';ctx.fillText('ベッド',0,41);
  }else if(text==='手すり'){
    ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(34,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(-28,14);ctx.moveTo(28,0);ctx.lineTo(28,14);ctx.stroke();
    ctx.fillStyle='#222';ctx.fillText('手すり',0,34);
  }else if(text==='段差'){
    ctx.beginPath();ctx.moveTo(-32,-10);ctx.lineTo(0,-10);ctx.lineTo(0,10);ctx.lineTo(32,10);ctx.stroke();
    ctx.fillStyle='#222';ctx.fillText('段差',0,35);
  }else if(text==='階段'){
    for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(-34+i*12,-24);ctx.lineTo(-34+i*12,24);ctx.stroke();}
    ctx.strokeRect(-34,-24,68,48);ctx.fillStyle='#222';ctx.fillText('階段',0,42);
  }else if(text==='車いす'){
    ctx.beginPath();ctx.arc(-7,8,16,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(10,-15,6,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(5,-8);ctx.lineTo(12,10);ctx.lineTo(-4,10);ctx.stroke();
    ctx.fillStyle='#222';ctx.fillText('車いす',0,42);
  }else if(text==='歩行器'){
    ctx.strokeRect(-24,-20,48,38);
    ctx.beginPath();ctx.arc(-19,23,4,0,Math.PI*2);ctx.arc(19,23,4,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#222';ctx.fillText('歩行器',0,43);
  }else{
    ctx.strokeRect(-34,-20,68,40);
    ctx.fillStyle='#222';ctx.fillText(text,0,5);
  }
  ctx.restore();
}

function hitTest(p){
  for(let i=actions.length-1;i>=0;i--){
    const a=actions[i];
    if((a.type==='item'||a.type==='text') && Math.abs(p.x-a.x)<=55 && Math.abs(p.y-a.y)<=45) return i;
  }
  return -1;
}

function drawSelection(a){
  if(a.x===undefined) return;
  ctx.save();ctx.strokeStyle='#1976d2';ctx.lineWidth=2;ctx.setLineDash([5,4]);
  ctx.strokeRect(a.x-50,a.y-48,100,96);ctx.restore();
}

function deleteSelected(){
  if(selectedIndex<0){ alert('「移動」で削除したい設備や文字を選んでください。'); return; }
  actions.splice(selectedIndex,1); selectedIndex=-1; draw();
}
function drawPreview(a,b){
  ctx.save();ctx.strokeStyle='#1976d2';ctx.lineWidth=3;ctx.setLineDash([8,5]);
  if(mode==='room'){
    const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);
    ctx.strokeRect(x,y,Math.abs(b.x-a.x),Math.abs(b.y-a.y));
  }else{
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  ctx.restore();
}

function undo(){ actions.pop(); selectedIndex=-1; draw(); }
function clearAll(){
  if(confirm('全部消去しますか？')){ actions=[]; selectedIndex=-1; draw(); }
}
function saveImage(){
  draw();
  const link=document.createElement('a');
  link.download='care-manager-map.png';
  link.href=c.toDataURL('image/png');
  link.click();
}

draw();
</script>
</body>
</html>
