<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<title>ケアマネ間取り図 V13.4</title>
<style>
*{box-sizing:border-box}
:root{--blue:#1976d2;--bg:#f4f7fb;--line:#dbe2ea;--text:#222}
body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--blue);color:#fff;padding:12px 14px;font-weight:700;font-size:20px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select{border:1px solid #d7dee8;border-radius:10px;padding:10px 12px;font-size:15px;background:#eef3f8;color:#222}
button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary{background:#eaf3ff}
button.success{background:#e8f6ec}
button.danger{background:#ffecec;color:#a40018}
.group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.label{font-size:12px;color:#666}
.help{background:#fff;padding:8px 12px;border-bottom:1px solid #e6e6e6;font-size:13px;color:#555}
#wrap{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}
canvas{display:block;background:#fff;border:1px solid #aaa;box-shadow:0 2px 9px #0001;touch-action:none}
.note{font-size:12px;color:#666;padding:0 12px 14px}
@media(max-width:700px){
  header{font-size:18px}
  .toolbar{gap:5px;padding:7px}
  button,select{font-size:14px;padding:10px}
  .label{display:none}
}
</style>
</head>
<body>
<header>ケアマネ間取り図 <small style="font-size:12px;font-weight:500;opacity:.9">V13.4</small></header>

<div class="toolbar">
  <div class="group">
    <span class="label">描く</span>
    <button id="roomBtn" class="active" onclick="setMode('room',this)">部屋</button>
    <button onclick="setMode('line',this)">壁・線</button>
    <button onclick="setMode('door',this)">ドア</button>
    <button onclick="setMode('slidingDoor',this)">引き戸</button>
    <button onclick="setMode('foldingDoor',this)">浴室折れ戸 W</button>
    <button onclick="setMode('window',this)">窓</button>
  </div>

  <div class="group">
    <span class="label">置く</span>
    <select id="itemSelect" onchange="setItem(this.value)">
      <option value="">設備を選ぶ</option>
      <option>玄関（外開き）</option><option>玄関（内開き）</option><option>玄関（引き戸）</option><option>トイレ（洋式）</option><option>トイレ（和式）</option><option>ポータブルトイレ</option><option>浴室</option><option>洗面</option>
      <option>台所</option><option>ベッド</option><option>手すり（横）</option><option>手すり（縦）</option><option>段差</option>
      <option>階段</option><option>勝手口（外開き）</option><option>勝手口（内開き）</option><option>勝手口（引き戸）</option><option>スロープ</option><option>門柱</option>
      <option>廊下</option>
    </select>
    <button onclick="setMode('text',this)">文字</button>
    <button onclick="setMode('select',this)">移動</button>
    <button onclick="selectNextUnderPoint()">重なり選択</button>
    <button onclick="rotateSelected()">↻ 回転</button>
    <button onclick="resizeSelected(1.1)">＋ 大きく</button>
    <button onclick="resizeSelected(0.9)">－ 小さく</button>
    <button onclick="resetSelectedSize()">等倍</button>
    <button onclick="flipDoor()">⇄ ドア反転</button>
    <button onclick="deleteSelected()">選択削除</button>
  </div>

  <div class="group">
    <button onclick="undo()">1つ戻す</button>
    <button class="success" onclick="saveImage()">画像保存</button>
    <button class="danger" onclick="clearAll()">全消去</button>
  </div>
</div>

<div class="help" id="help">「部屋」：始点から終点までドラッグして四角を作ります。</div>
<div id="wrap"><canvas id="c" width="1100" height="760"></canvas></div>
<div class="note">※ 利用者名など個人情報を含む画像の保存・共有にはご注意ください。</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),help=document.getElementById('help');
let mode='room',selectedItem='',start=null,temp=null,actions=[],selectedIndex=-1,dragOffset=null,activePointerId=null,lastSelectPoint=null,lastCandidates=[];

function setMode(m,btn){
  mode=m; selectedItem=''; document.getElementById('itemSelect').value='';
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const t={
    room:'「部屋」：ドラッグして部屋の四角を作ります。',
    corridor:'「廊下」：ドラッグして廊下を作ります。',
    line:'「壁・線」：ドラッグして壁や仕切り線を引きます。',
    door:'「ドア」：ドラッグして開き戸を作ります。円弧は小さめに表示します。',
    slidingDoor:'「引き戸」：ドラッグして引き戸を作ります。',
    foldingDoor:'「浴室折れ戸 W」：ドラッグしてW型の折れ戸を作ります。',
    window:'「窓」：ドラッグして窓を作ります。',
    text:'「文字」：置きたい場所をタップして、部屋名などを入力します。',
    select:'「移動」：部屋・廊下・壁・ドア・窓・設備・文字をタップして移動できます。開き戸は「⇄ ドア反転」ができます。'
  };
  help.textContent=t[m]||'';
  if(m!=='select') selectedIndex=-1;
  draw();
}
function setItem(v){
  if(!v)return;
  if(v==='廊下'){mode='corridor'; selectedItem=''; selectedIndex=-1; document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active')); help.textContent='「廊下」：ドラッグして好きな幅・長さの廊下を作ります。必要に応じて複数の廊下を重ねてL字・T字・十字にもできます。'; draw(); return;}
  mode='item';selectedItem=v;selectedIndex=-1;
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  help.textContent=`「${v}」を置きたい場所をタップしてください。`;
}
function pnt(e){
  const r=c.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*(c.width/r.width),
    y:(e.clientY-r.top)*(c.height/r.height)
  };
}
function snap(v){return Math.round(v/25)*25}
function snapPoint(p){return{x:snap(p.x),y:snap(p.y)}}

function pointerDown(e){
  if(e.pointerType==='mouse' && e.button!==0)return;
  e.preventDefault();
  activePointerId=e.pointerId;
  try{c.setPointerCapture(e.pointerId)}catch(_){ }
  const raw=pnt(e),p=snapPoint(raw);

  if(mode==='select'){
    lastSelectPoint=p;lastCandidates=hitTestAll(p);
    selectedIndex=lastCandidates.length?lastCandidates[0]:-1;
    if(selectedIndex>=0){
      const a=actions[selectedIndex];
      if(a.x!==undefined)dragOffset={kind:'point',x:raw.x-a.x,y:raw.y-a.y};
      else if(a.x1!==undefined)dragOffset={kind:'shape',x:raw.x-a.x1,y:raw.y-a.y1,dx:a.x2-a.x1,dy:a.y2-a.y1};
    }else dragOffset=null;
    draw();return;
  }
  if(mode==='item'){
    actions.push({type:'item',x:p.x,y:p.y,text:selectedItem,rot:0,scale:1});
    draw();return;
  }
  if(mode==='text'){
    const t=prompt('文字を入力してください（例：居間、寝室、和室、LDK）');
    if(t){actions.push({type:'text',x:p.x,y:p.y,text:t});draw()}
    return;
  }
  start=p;
  temp=p;
  draw();
  drawPreview(start,temp);
}
function pointerMove(e){
  if(activePointerId!==null && e.pointerId!==activePointerId)return;
  if(activePointerId===null)return;
  e.preventDefault();
  const raw=pnt(e),p=snapPoint(raw);

  if(mode==='select'&&selectedIndex>=0&&dragOffset){
    const a=actions[selectedIndex];
    if(dragOffset.kind==='point'&&a.x!==undefined){
      a.x=snap(raw.x-dragOffset.x);a.y=snap(raw.y-dragOffset.y);
    }else if(dragOffset.kind==='shape'&&a.x1!==undefined){
      const nx=snap(raw.x-dragOffset.x),ny=snap(raw.y-dragOffset.y);
      a.x1=nx;a.y1=ny;a.x2=nx+dragOffset.dx;a.y2=ny+dragOffset.dy;
    }
    draw();return;
  }
  if(!start)return;
  temp=p;
  draw();
  drawPreview(start,temp);
}
function pointerUp(e){
  if(activePointerId!==null && e.pointerId!==activePointerId)return;
  e.preventDefault();
  const p=snapPoint(pnt(e));

  if(mode==='select'){
    dragOffset=null;
    activePointerId=null;
    try{c.releasePointerCapture(e.pointerId)}catch(_){ }
    return;
  }
  if(start){
    const end=p;
    // 誤タップで極端に小さい図形が増えないよう、同一点なら作成しない
    if(start.x!==end.x || start.y!==end.y){
      actions.push({type:mode,x1:start.x,y1:start.y,x2:end.x,y2:end.y});
    }
    start=null;temp=null;draw();
  }
  activePointerId=null;
  try{c.releasePointerCapture(e.pointerId)}catch(_){ }
}
function pointerCancel(e){
  if(activePointerId!==null && e.pointerId!==activePointerId)return;
  start=null;temp=null;dragOffset=null;activePointerId=null;draw();
}

c.addEventListener('pointerdown',pointerDown);
c.addEventListener('pointermove',pointerMove);
c.addEventListener('pointerup',pointerUp);
c.addEventListener('pointercancel',pointerCancel);
c.addEventListener('contextmenu',e=>e.preventDefault());

function drawGrid(){
  ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.lineWidth=1;ctx.strokeStyle='#edf1f5';
  for(let x=0;x<=c.width;x+=25){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<=c.height;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
  ctx.strokeStyle='#d7dde5';
  for(let x=0;x<=c.width;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<=c.height;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
}
function draw(){drawGrid();actions.forEach((a,i)=>{drawAction(a);if(i===selectedIndex)drawSelection(a)})}
function drawAction(a){
  ctx.save();ctx.strokeStyle='#222';ctx.fillStyle='#222';ctx.lineWidth=2.4;ctx.font='18px sans-serif';
  if(a.type==='room'||a.type==='corridor'){
    const x=Math.min(a.x1,a.x2),y=Math.min(a.y1,a.y2),w=Math.abs(a.x2-a.x1),h=Math.abs(a.y2-a.y1);
    if(a.type==='corridor'){ctx.fillStyle='#f4f4f4';ctx.fillRect(x,y,w,h);ctx.lineWidth=2;ctx.strokeStyle='#333';ctx.strokeRect(x,y,w,h);ctx.strokeStyle='#c9c9c9';ctx.lineWidth=1;for(let xx=x+12;xx<x+w;xx+=18){ctx.beginPath();ctx.moveTo(xx,y+2);ctx.lineTo(xx,y+h-2);ctx.stroke()}ctx.fillStyle='#222';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('廊下',x+w/2,y+h/2+5);}else{ctx.lineWidth=2.4;ctx.strokeRect(x,y,w,h);}
  }else if(a.type==='line'){
    ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();
  }else if(a.type==='door'){drawDoor(a.x1,a.y1,a.x2,a.y2,a.flip||false)}
  else if(a.type==='slidingDoor'){drawSlidingDoor(a.x1,a.y1,a.x2,a.y2)}
  else if(a.type==='foldingDoor'){drawFoldingDoor(a.x1,a.y1,a.x2,a.y2,a.flip||false)}
  else if(a.type==='window'){drawWindow(a.x1,a.y1,a.x2,a.y2)}
  else if(a.type==='text'){ctx.fillText(a.text,a.x,a.y)}
  else if(a.type==='item'){drawItem(a.text,a.x,a.y,a.rot||0,a.scale||1)}
  ctx.restore();
}
function drawDoor(x1,y1,x2,y2,flip=false){
  const leaf=Math.hypot(x2-x1,y2-y1);if(leaf<5)return;
  const ang=Math.atan2(y2-y1,x2-x1);
  const arcR=leaf*0.80;

  // 戸本体
  ctx.save();
  ctx.strokeStyle='#222';
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();

  // 蝶番
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(x1,y1,3.5,0,Math.PI*2);ctx.fill();

  // 円弧は戸本体を境に、左右どちら側にも切替可能
  ctx.strokeStyle='#555';
  ctx.lineWidth=1.8;
  ctx.setLineDash([5,4]);
  ctx.beginPath();
  if(flip){
    ctx.arc(x1,y1,arcR,ang,ang-Math.PI/2,true);
  }else{
    ctx.arc(x1,y1,arcR,ang,ang+Math.PI/2,false);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawSlidingDoor(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<5)return;
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux,mx=(x1+x2)/2,my=(y1+y2)/2,q=len*.23;
  ctx.save();ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(x1+nx*3,y1+ny*3);ctx.lineTo(x2+nx*3,y2+ny*3);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x1-nx*3,y1-ny*3);ctx.lineTo(x2-nx*3,y2-ny*3);ctx.stroke();
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(mx-ux*q+nx*7,my-uy*q+ny*7);ctx.lineTo(mx+ux*q+nx*7,my+uy*q+ny*7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx-ux*q-nx*7,my-uy*q-ny*7);ctx.lineTo(mx+ux*q-nx*7,my+uy*q-ny*7);ctx.stroke();ctx.restore();
}
function drawFoldingDoor(x1,y1,x2,y2,flip=false){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<5)return;
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux,mx=(x1+x2)/2,my=(y1+y2)/2;
  const side=flip?-1:1;
  const fold=Math.min(16,len*.28)*side;

  ctx.save();
  // 浴室折れ戸は青で通常ドアと見分けやすくする
  ctx.strokeStyle='#1976d2';
  ctx.lineWidth=2.6;
  ctx.lineCap='round';
  ctx.lineJoin='round';

  // W型。flipで折れ方向を反対側へ
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(mx-ux*len*.18+nx*fold,my-uy*len*.18+ny*fold);
  ctx.lineTo(mx,my);
  ctx.lineTo(mx+ux*len*.18+nx*fold,my+uy*len*.18+ny*fold);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  ctx.restore();
}

function drawWindow(x1,y1,x2,y2){
  ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function drawItem(text,x,y,rot=0,scale=1){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.strokeStyle='#222';ctx.fillStyle='#fff';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';

  // 設備本体だけ回転。名称は読みやすいよう回転させない。
  ctx.save();
  ctx.rotate((rot*Math.PI)/180);

  if(text==='トイレ' || text==='トイレ（洋式）'){
    // タンク＋便座＋便器
    ctx.strokeRect(-14,-30,28,13);
    ctx.beginPath();ctx.ellipse(0,3,16,22,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,1,9,14,0,0,Math.PI*2);ctx.stroke();
  }else if(text==='トイレ（和式）'){
    ctx.strokeRect(-18,-31,36,62);
    ctx.beginPath();ctx.ellipse(0,3,8,21,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-12,-21);ctx.lineTo(12,-21);ctx.moveTo(-12,23);ctx.lineTo(12,23);ctx.stroke();
  }else if(text==='ポータブルトイレ'){
    ctx.strokeRect(-25,-23,50,44);ctx.strokeRect(-20,-32,40,10);
    ctx.beginPath();ctx.ellipse(0,-2,14,10,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-20,21);ctx.lineTo(-27,34);ctx.moveTo(20,21);ctx.lineTo(27,34);ctx.stroke();
  }else if(text==='浴室'){
    // 浴槽＋シャワー
    ctx.strokeRect(-40,-25,80,50);ctx.beginPath();ctx.roundRect(-31,-12,59,25,10);ctx.stroke();
    ctx.beginPath();ctx.arc(27,-13,6,Math.PI,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(27,-19);ctx.lineTo(35,-27);ctx.stroke();
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(30+i*3,-8);ctx.lineTo(31+i*3,-4);ctx.stroke();}
  }else if(text==='洗面'){
    // 洗面台＋水栓
    ctx.strokeRect(-31,-22,62,44);ctx.beginPath();ctx.ellipse(0,3,19,12,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,-17);ctx.lineTo(10,-17);ctx.lineTo(10,-11);ctx.stroke();
  }else if(text==='台所'){
    // シンク＋2口コンロ
    ctx.strokeRect(-43,-22,86,44);ctx.roundRect(-36,-14,30,26,5);ctx.stroke();
    ctx.beginPath();ctx.arc(16,-5,7,0,Math.PI*2);ctx.arc(31,8,7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-20,-14);ctx.lineTo(-20,-20);ctx.lineTo(-9,-20);ctx.stroke();
  }else if(text==='玄関（外開き）'||text==='玄関（内開き）'||text==='玄関（引き戸）'){
    // 玄関3タイプ：外開き・内開き・引き戸。小さくても判別しやすい平面記号。
    ctx.lineWidth=3;ctx.strokeRect(-42,-30,84,60);
    ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-42,8);ctx.lineTo(42,8);ctx.stroke(); // 上がり框
    ctx.strokeRect(22,-24,14,25); // 下駄箱
    // 土間タイル
    ctx.setLineDash([3,3]);for(let xx=-34;xx<=14;xx+=12){ctx.beginPath();ctx.moveTo(xx,10);ctx.lineTo(xx,28);ctx.stroke()}ctx.setLineDash([]);
    if(text==='玄関（引き戸）'){
      ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-30,-30);ctx.lineTo(30,-30);ctx.stroke();
      ctx.lineWidth=2;ctx.strokeRect(-27,-26,26,7);ctx.strokeRect(1,-26,26,7);
      ctx.beginPath();ctx.moveTo(-12,-14);ctx.lineTo(12,-14);ctx.moveTo(-12,-14);ctx.lineTo(-6,-19);ctx.moveTo(-12,-14);ctx.lineTo(-6,-9);ctx.moveTo(12,-14);ctx.lineTo(6,-19);ctx.moveTo(12,-14);ctx.lineTo(6,-9);ctx.stroke();
    }else{
      const outer=text==='玄関（外開き）';
      const hy=-30, len=48, closedX=-28;
      ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(closedX,hy);ctx.lineTo(closedX+len,hy);ctx.stroke();
      ctx.lineWidth=2;ctx.beginPath();
      if(outer){ctx.moveTo(closedX,hy);ctx.lineTo(closedX,hy-len);ctx.arc(closedX,hy,len,-Math.PI/2,0,false)}
      else{ctx.moveTo(closedX,hy);ctx.lineTo(closedX,hy+len);ctx.arc(closedX,hy,len,Math.PI/2,0,true)}
      ctx.stroke();
    }
  }else if(text==='ベッド'){
    // ひと目でベッドと分かる「枕＋掛け布団＋フレーム」
    ctx.lineWidth=3;ctx.strokeRect(-45,-27,90,54);
    ctx.lineWidth=2;ctx.roundRect(-38,-19,20,38,7);ctx.stroke(); // 枕
    ctx.beginPath();ctx.moveTo(-14,-27);ctx.lineTo(-14,27);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-10,-18);ctx.quadraticCurveTo(8,-11,36,-16);ctx.lineTo(36,18);ctx.quadraticCurveTo(8,11,-10,17);ctx.closePath();ctx.stroke();
    // ベッド柵・脚
    ctx.beginPath();ctx.moveTo(-45,-33);ctx.lineTo(-45,33);ctx.moveTo(45,-33);ctx.lineTo(45,33);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-33,-31);ctx.lineTo(33,-31);ctx.moveTo(-33,31);ctx.lineTo(33,31);ctx.stroke();
  }else if(text==='手すり（横）'){
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-38,0);ctx.lineTo(38,0);ctx.stroke();
    ctx.lineWidth=2;[-28,0,28].forEach(px=>{ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,15);ctx.lineTo(px+7,15);ctx.stroke();});
  }else if(text==='手すり（縦）'){
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(0,38);ctx.stroke();
    ctx.lineWidth=2;[-28,0,28].forEach(py=>{ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(15,py);ctx.lineTo(15,py+7);ctx.stroke();});
  }else if(text==='段差'){
    ctx.beginPath();ctx.moveTo(-36,-13);ctx.lineTo(2,-13);ctx.lineTo(2,12);ctx.lineTo(36,12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-26,4);ctx.lineTo(-10,4);ctx.lineTo(-10,12);ctx.stroke();
  }else if(text==='勝手口（外開き）'||text==='勝手口（内開き）'||text==='勝手口（引き戸）'){
    // 勝手口：外側を下、室内側を上として表現。外開き・内開き・引き戸を区別。
    ctx.lineWidth=3;ctx.strokeRect(-25,-32,50,64);
    ctx.lineWidth=2;ctx.strokeRect(-16,-22,32,20);ctx.beginPath();ctx.moveTo(-16,-12);ctx.lineTo(16,-12);ctx.stroke();
    if(text==='勝手口（引き戸）'){
      ctx.beginPath();ctx.moveTo(-13,8);ctx.lineTo(13,8);
      ctx.moveTo(-13,8);ctx.lineTo(-7,3);ctx.moveTo(-13,8);ctx.lineTo(-7,13);
      ctx.moveTo(13,8);ctx.lineTo(7,3);ctx.moveTo(13,8);ctx.lineTo(7,13);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-4,-32);ctx.lineTo(-4,32);ctx.stroke();
    }else{
      const outer=text==='勝手口（外開き）';
      const hx=-20, hy=32, len=30;
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(hx,hy,2.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';
      ctx.beginPath();
      if(outer){
        // 外開き：外側（下）へ
        ctx.moveTo(hx,hy);ctx.lineTo(hx,hy+len);
        ctx.arc(hx,hy,len,Math.PI/2,0,true);
      }else{
        // 内開き：室内側（上）へ
        ctx.moveTo(hx,hy);ctx.lineTo(hx,hy-len);
        ctx.arc(hx,hy,len,-Math.PI/2,0,false);
      }
      ctx.stroke();
    }
    // 外段差
    ctx.beginPath();ctx.moveTo(-34,32);ctx.lineTo(34,32);ctx.moveTo(-28,40);ctx.lineTo(28,40);ctx.moveTo(-22,47);ctx.lineTo(22,47);ctx.stroke();
  }else if(text==='スロープ'){
    // 傾斜面＋両側手すり＋進行矢印
    ctx.beginPath();ctx.moveTo(-38,20);ctx.lineTo(30,-19);ctx.lineTo(38,20);ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-36,12);ctx.lineTo(24,-24);ctx.moveTo(-31,20);ctx.lineTo(-31,7);ctx.moveTo(27,-19);ctx.lineTo(27,-31);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-15,7);ctx.lineTo(10,-8);ctx.lineTo(5,-9);ctx.moveTo(10,-8);ctx.lineTo(8,-3);ctx.stroke();
  }else if(text==='門柱'){
    // 2本の門柱＋開口
    ctx.strokeRect(-34,-27,14,54);ctx.strokeRect(20,-27,14,54);
    ctx.beginPath();ctx.moveTo(-20,17);ctx.lineTo(20,17);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-27,-27);ctx.lineTo(-27,-34);ctx.moveTo(27,-27);ctx.lineTo(27,-34);ctx.stroke();
  }else if(text==='階段'){
    ctx.strokeRect(-39,-25,78,50);for(let i=1;i<7;i++){ctx.beginPath();ctx.moveTo(-39+i*11,-25);ctx.lineTo(-39+i*11,25);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(24,0);ctx.lineTo(15,-7);ctx.moveTo(24,0);ctx.lineTo(15,7);ctx.stroke();
  }
  ctx.restore();

  // 名称は常に水平表示
  ctx.fillStyle='#222';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
  const labels={
    'トイレ（洋式）':'洋式WC','トイレ':'WC','トイレ（和式）':'和式WC','ポータブルトイレ':'ポータブル',
    '浴室':'浴室','洗面':'洗面','台所':'台所','玄関（外開き）':'玄関 外開き','玄関（内開き）':'玄関 内開き','玄関（引き戸）':'玄関 引き戸','ベッド':'ベッド','手すり（横）':'横手すり','手すり（縦）':'縦手すり',
    '段差':'段差','勝手口（外開き）':'勝手口 外開き','勝手口（内開き）':'勝手口 内開き','勝手口（引き戸）':'勝手口 引き戸','スロープ':'スロープ','門柱':'門柱','階段':'階段'
  };
  if(labels[text])ctx.fillText(labels[text],0,42);
  ctx.restore();
}
function pointSegDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(!l2)return Math.hypot(px-x1,py-y1);
  let t=((px-x1)*dx+(py-y1)*dy)/l2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function hitTestAll(p){
  const found=[];
  for(let i=actions.length-1;i>=0;i--){
    const a=actions[i];let hit=false;
    if(a.type==='item'){const sc=a.scale||1;hit=Math.abs(p.x-a.x)<=58*sc&&Math.abs(p.y-a.y)<=58*sc;}
    else if(a.type==='text')hit=Math.abs(p.x-a.x)<=58&&Math.abs(p.y-a.y)<=58;
    else if(a.type==='room'||a.type==='corridor'){
      const minx=Math.min(a.x1,a.x2),maxx=Math.max(a.x1,a.x2),miny=Math.min(a.y1,a.y2),maxy=Math.max(a.y1,a.y2);
      hit=p.x>=minx-10&&p.x<=maxx+10&&p.y>=miny-10&&p.y<=maxy+10;
    }else if(['line','door','slidingDoor','foldingDoor','window'].includes(a.type))
      hit=pointSegDist(p.x,p.y,a.x1,a.y1,a.x2,a.y2)<=22;
    if(hit)found.push(i);
  }
  return found;
}
function hitTest(p){const f=hitTestAll(p);return f.length?f[0]:-1;}
function selectNextUnderPoint(){
  if(mode!=='select'){alert('先に「移動」を押してください。');return;}
  if(!lastSelectPoint){alert('重なっている場所を先にタップしてください。');return;}
  lastCandidates=hitTestAll(lastSelectPoint);
  if(!lastCandidates.length){selectedIndex=-1;draw();return;}
  let pos=lastCandidates.indexOf(selectedIndex);
  selectedIndex=lastCandidates[(pos+1+lastCandidates.length)%lastCandidates.length];
  dragOffset=null;
  const a=actions[selectedIndex];
  const name=a.type==='item'?a.text:({room:'部屋',corridor:'廊下',line:'壁・線',door:'ドア',slidingDoor:'引き戸',foldingDoor:'浴室折れ戸',window:'窓',text:'文字'}[a.type]||'図形');
  help.textContent='選択中：'+name+'。「重なり選択」で次の図形に切り替えられます。';
  draw();
}

function drawSelection(a){
  ctx.save();ctx.strokeStyle='#1976d2';ctx.lineWidth=2;ctx.setLineDash([6,4]);
  if(a.x1!==undefined){
    const pad=14,x=Math.min(a.x1,a.x2)-pad,y=Math.min(a.y1,a.y2)-pad;
    ctx.strokeRect(x,y,Math.abs(a.x2-a.x1)+pad*2,Math.abs(a.y2-a.y1)+pad*2);
  }else if(a.x!==undefined){
    ctx.translate(a.x,a.y);ctx.rotate(((a.rot||0)*Math.PI)/180);const sc=a.scale||1;ctx.strokeRect(-54*sc,-50*sc,108*sc,100*sc);
  }
  ctx.restore();
}
function rotateSelected(){
  if(selectedIndex<0){alert('先に「移動」で設備を選択してください。');return}
  const a=actions[selectedIndex];
  if(a.type!=='item'){alert('回転できるのは設備です。');return}
  a.rot=((a.rot||0)+90)%360;draw();
}
function resizeSelected(factor){
  if(selectedIndex<0){alert('先に「移動」で大きさを変えたい設備を選択してください。');return}
  const a=actions[selectedIndex];
  if(a.type!=='item'){alert('大きさを変更できるのは設備です。');return}
  const next=(a.scale||1)*factor;
  a.scale=Math.max(0.5,Math.min(2.5,next));
  draw();
  help.textContent=`設備の大きさ：${Math.round(a.scale*100)}％（50〜250％）`;
}
function resetSelectedSize(){
  if(selectedIndex<0){alert('先に「移動」で設備を選択してください。');return}
  const a=actions[selectedIndex];
  if(a.type!=='item'){alert('等倍に戻せるのは設備です。');return}
  a.scale=1;draw();help.textContent='設備の大きさを100％に戻しました。';
}
function flipDoor(){
  if(selectedIndex<0){alert('先に「移動」を押して、向きを変えたいドアを選択してください。');return}
  const a=actions[selectedIndex];
  if(a.type!=='door'&&a.type!=='foldingDoor'){
    alert('この反転は開き戸または浴室折れ戸を選択した時に使えます。');return;
  }
  a.flip=!a.flip;draw();
  if(a.type==='foldingDoor'){
    help.textContent='浴室折れ戸の折れる向きを反転しました。もう一度押すと元に戻せます。';
  }else{
    help.textContent='ドアの円弧を反対側に切り替えました。もう一度押すと元に戻せます。';
  }
}

function drawPreview(a,b){
  ctx.save();ctx.strokeStyle='#1976d2';ctx.lineWidth=3;ctx.setLineDash([8,5]);
  if(mode==='room'||mode==='corridor'){const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);ctx.strokeRect(x,y,Math.abs(b.x-a.x),Math.abs(b.y-a.y))}
  else if(mode==='corridor'){const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);ctx.strokeRect(x,y,Math.abs(b.x-a.x),Math.abs(b.y-a.y));}else{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  ctx.restore();
}
function deleteSelected(){
  if(selectedIndex<0){alert('先に「移動」を押して、削除したい設備または文字を選んでください。');return}
  actions.splice(selectedIndex,1);selectedIndex=-1;draw();
}
function undo(){actions.pop();selectedIndex=-1;draw()}
function clearAll(){if(confirm('全部消去しますか？')){actions=[];selectedIndex=-1;draw()}}
function saveImage(){
  const old=selectedIndex;selectedIndex=-1;draw();
  const a=document.createElement('a');a.download='care-manager-map.png';a.href=c.toDataURL('image/png');a.click();
  selectedIndex=old;draw();
}
draw();
</script>
