<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<title>ケアマネ間取り図 V7</title>
<style>
*{box-sizing:border-box}
:root{--blue:#1976d2;--bg:#f4f7fb;--line:#dbe2ea;--text:#222}
body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--blue);color:#fff;padding:12px 14px;font-weight:700;font-size:20px}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select{border:1px solid #d7dee8;border-radius:10px;padding:10px 12px;font-size:15px;background:#eef3f8;color:#222}
button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary{background:#eaf3ff}
button.success{background:#e8f6ec}
button.danger{background:#ffecec;color:#a40018}
.group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.label{font-size:12px;color:#666}
.help{background:#fff;padding:8px 12px;border-bottom:1px solid #e6e6e6;font-size:13px;color:#555}
#wrap{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}
canvas{display:block;background:#fff;border:1px solid #aaa;box-shadow:0 2px 9px #0001;touch-action:none}
.note{font-size:12px;color:#666;padding:0 12px 14px}
@media(max-width:700px){
  header{font-size:18px}
  .toolbar{gap:5px;padding:7px}
  button,select{font-size:14px;padding:10px}
  .label{display:none}
}
</style>
</head>
<body>
<header>ケアマネ間取り図 <small style="font-size:12px;font-weight:500;opacity:.9">V7</small></header>

<div class="toolbar">
  <div class="group">
    <span class="label">描く</span>
    <button id="roomBtn" class="active" onclick="setMode('room',this)">部屋</button>
    <button onclick="setMode('line',this)">壁・線</button>
    <button onclick="setMode('door',this)">ドア</button>
    <button onclick="setMode('window',this)">窓</button>
  </div>

  <div class="group">
    <span class="label">置く</span>
    <select id="itemSelect" onchange="setItem(this.value)">
      <option value="">設備を選ぶ</option>
      <option>玄関</option><option>トイレ（洋式）</option><option>トイレ（和式）</option><option>ポータブルトイレ</option><option>浴室</option><option>洗面</option>
      <option>台所</option><option>ベッド</option><option>手すり（横）</option><option>手すり（縦）</option><option>段差</option>
      <option>階段</option><option>勝手口</option><option>スロープ</option><option>門柱</option>
      <option>廊下</option><option>廊下（L字）</option><option>廊下（T字）</option>
    </select>
    <button onclick="setMode('text',this)">文字</button>
    <button onclick="setMode('select',this)">移動</button>
    <button onclick="rotateSelected()">↻ 回転</button>
    <button onclick="flipDoor()">⇄ ドア反転</button>
    <button onclick="deleteSelected()">選択削除</button>
  </div>

  <div class="group">
    <button onclick="undo()">1つ戻す</button>
    <button class="success" onclick="saveImage()">画像保存</button>
    <button class="danger" onclick="clearAll()">全消去</button>
  </div>
</div>

<div class="help" id="help">「部屋」：始点から終点までドラッグして四角を作ります。</div>
<div id="wrap"><canvas id="c" width="1100" height="760"></canvas></div>
<div class="note">※ 利用者名など個人情報を含む画像の保存・共有にはご注意ください。</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),help=document.getElementById('help');
let mode='room',selectedItem='',start=null,temp=null,actions=[],selectedIndex=-1,dragOffset=null,activePointerId=null;

function setMode(m,btn){
  mode=m; selectedItem=''; document.getElementById('itemSelect').value='';
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const t={
    room:'「部屋」：ドラッグして部屋の四角を作ります。',
    corridor:'「廊下」：ドラッグして廊下を作ります。',
    line:'「壁・線」：ドラッグして壁や仕切り線を引きます。',
    door:'「ドア」：ドラッグして開き戸を作ります。',
    window:'「窓」：ドラッグして窓を作ります。',
    text:'「文字」：置きたい場所をタップして、部屋名などを入力します。',
    select:'「移動」：設備・文字・ドアをタップして選択できます。設備は「↻ 回転」、ドアは「⇄ ドア反転」で開く向きを切り替えられます。'
  };
  help.textContent=t[m]||'';
  if(m!=='select') selectedIndex=-1;
  draw();
}
function setItem(v){
  if(!v)return;
  if(v==='廊下'){mode='corridor'; selectedItem=''; selectedIndex=-1; document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active')); help.textContent='「廊下」：ドラッグして直線の廊下を作ります。'; draw(); return;}
  mode='item';selectedItem=v;selectedIndex=-1;
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  help.textContent=`「${v}」を置きたい場所をタップしてください。`;
}
function pnt(e){
  const r=c.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*(c.width/r.width),
    y:(e.clientY-r.top)*(c.height/r.height)
  };
}
function snap(v){return Math.round(v/25)*25}
function snapPoint(p){return{x:snap(p.x),y:snap(p.y)}}

function pointerDown(e){
  if(e.pointerType==='mouse' && e.button!==0)return;
  e.preventDefault();
  activePointerId=e.pointerId;
  try{c.setPointerCapture(e.pointerId)}catch(_){ }
  const raw=pnt(e),p=snapPoint(raw);

  if(mode==='select'){
    selectedIndex=hitTest(p);
    if(selectedIndex>=0){
      const a=actions[selectedIndex];
      if(a.x!==undefined)dragOffset={x:raw.x-a.x,y:raw.y-a.y};
    }else dragOffset=null;
    draw();return;
  }
  if(mode==='item'){
    actions.push({type:'item',x:p.x,y:p.y,text:selectedItem,rot:0});
    draw();return;
  }
  if(mode==='text'){
    const t=prompt('文字を入力してください（例：居間、寝室、和室、LDK）');
    if(t){actions.push({type:'text',x:p.x,y:p.y,text:t});draw()}
    return;
  }
  start=p;
  temp=p;
  draw();
  drawPreview(start,temp);
}
function pointerMove(e){
  if(activePointerId!==null && e.pointerId!==activePointerId)return;
  if(activePointerId===null)return;
  e.preventDefault();
  const raw=pnt(e),p=snapPoint(raw);

  if(mode==='select'&&selectedIndex>=0&&dragOffset){
    const a=actions[selectedIndex];
    if(a.x!==undefined){
      a.x=snap(raw.x-dragOffset.x);
      a.y=snap(raw.y-dragOffset.y);
      draw();
    }
    return;
  }
  if(!start)return;
  temp=p;
  draw();
  drawPreview(start,temp);
}
function pointerUp(e){
  if(activePointerId!==null && e.pointerId!==activePointerId)return;
  e.preventDefault();
  const p=snapPoint(pnt(e));

  if(mode==='select'){
    dragOffset=null;
    activePointerId=null;
    try{c.releasePointerCapture(e.pointerId)}catch(_){ }
    return;
  }
  if(start){
    const end=p;
    // 誤タップで極端に小さい図形が増えないよう、同一点なら作成しない
    if(start.x!==end.x || start.y!==end.y){
      actions.push({type:mode,x1:start.x,y1:start.y,x2:end.x,y2:end.y});
    }
    start=null;temp=null;draw();
  }
  activePointerId=null;
  try{c.releasePointerCapture(e.pointerId)}catch(_){ }
}
function pointerCancel(e){
  if(activePointerId!==null && e.pointerId!==activePointerId)return;
  start=null;temp=null;dragOffset=null;activePointerId=null;draw();
}

c.addEventListener('pointerdown',pointerDown);
c.addEventListener('pointermove',pointerMove);
c.addEventListener('pointerup',pointerUp);
c.addEventListener('pointercancel',pointerCancel);
c.addEventListener('contextmenu',e=>e.preventDefault());

function drawGrid(){
  ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.lineWidth=1;ctx.strokeStyle='#edf1f5';
  for(let x=0;x<=c.width;x+=25){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<=c.height;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
  ctx.strokeStyle='#d7dde5';
  for(let x=0;x<=c.width;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  for(let y=0;y<=c.height;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
}
function draw(){drawGrid();actions.forEach((a,i)=>{drawAction(a);if(i===selectedIndex)drawSelection(a)})}
function drawAction(a){
  ctx.save();ctx.strokeStyle='#222';ctx.fillStyle='#222';ctx.lineWidth=4;ctx.font='18px sans-serif';
  if(a.type==='room'||a.type==='corridor'){
    const x=Math.min(a.x1,a.x2),y=Math.min(a.y1,a.y2),w=Math.abs(a.x2-a.x1),h=Math.abs(a.y2-a.y1);
    if(a.type==='corridor'){ctx.fillStyle='#f7f7f7';ctx.fillRect(x,y,w,h);ctx.setLineDash([8,5]);ctx.lineWidth=2;ctx.strokeStyle='#555';ctx.strokeRect(x,y,w,h);ctx.setLineDash([]);ctx.fillStyle='#555';ctx.font='14px sans-serif';ctx.fillText('廊下',x+w/2-14,y+h/2+5);}else{ctx.strokeRect(x,y,w,h);}
  }else if(a.type==='line'){
    ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo(a.x2,a.y2);ctx.stroke();
  }else if(a.type==='door'){drawDoor(a.x1,a.y1,a.x2,a.y2,a.flip||false)}
  else if(a.type==='window'){drawWindow(a.x1,a.y1,a.x2,a.y2)}
  else if(a.type==='text'){ctx.fillText(a.text,a.x,a.y)}
  else if(a.type==='item'){drawItem(a.text,a.x,a.y,a.rot||0)}
  ctx.restore();
}
function drawDoor(x1,y1,x2,y2,flip=false){
  const r=Math.hypot(x2-x1,y2-y1);if(r<5)return;
  const ang=Math.atan2(y2-y1,x2-x1);
  // 戸そのもの
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  // 蝶番を見やすく表示
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x1,y1,4,0,Math.PI*2);ctx.fill();
  // 開閉弧。flipで左右を反転
  ctx.lineWidth=2;ctx.setLineDash([5,4]);
  ctx.beginPath();
  if(flip) ctx.arc(x1,y1,r,ang-Math.PI/2,ang,false);
  else ctx.arc(x1,y1,r,ang,ang+Math.PI/2,false);
  ctx.stroke();ctx.setLineDash([]);
}
function drawWindow(x1,y1,x2,y2){
  ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function drawItem(text,x,y,rot=0){
  ctx.save();
  ctx.translate(x,y);
  ctx.strokeStyle='#222';ctx.fillStyle='#fff';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';

  // 設備本体だけ回転。名称は読みやすいよう回転させない。
  ctx.save();
  ctx.rotate((rot*Math.PI)/180);

  if(text==='トイレ' || text==='トイレ（洋式）'){
    // タンク＋便座＋便器
    ctx.strokeRect(-14,-30,28,13);
    ctx.beginPath();ctx.ellipse(0,3,16,22,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,1,9,14,0,0,Math.PI*2);ctx.stroke();
  }else if(text==='トイレ（和式）'){
    ctx.strokeRect(-18,-31,36,62);
    ctx.beginPath();ctx.ellipse(0,3,8,21,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-12,-21);ctx.lineTo(12,-21);ctx.moveTo(-12,23);ctx.lineTo(12,23);ctx.stroke();
  }else if(text==='ポータブルトイレ'){
    ctx.strokeRect(-25,-23,50,44);ctx.strokeRect(-20,-32,40,10);
    ctx.beginPath();ctx.ellipse(0,-2,14,10,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-20,21);ctx.lineTo(-27,34);ctx.moveTo(20,21);ctx.lineTo(27,34);ctx.stroke();
  }else if(text==='浴室'){
    // 浴槽＋シャワー
    ctx.strokeRect(-40,-25,80,50);ctx.beginPath();ctx.roundRect(-31,-12,59,25,10);ctx.stroke();
    ctx.beginPath();ctx.arc(27,-13,6,Math.PI,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(27,-19);ctx.lineTo(35,-27);ctx.stroke();
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(30+i*3,-8);ctx.lineTo(31+i*3,-4);ctx.stroke();}
  }else if(text==='洗面'){
    // 洗面台＋水栓
    ctx.strokeRect(-31,-22,62,44);ctx.beginPath();ctx.ellipse(0,3,19,12,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,-17);ctx.lineTo(10,-17);ctx.lineTo(10,-11);ctx.stroke();
  }else if(text==='台所'){
    // シンク＋2口コンロ
    ctx.strokeRect(-43,-22,86,44);ctx.roundRect(-36,-14,30,26,5);ctx.stroke();
    ctx.beginPath();ctx.arc(16,-5,7,0,Math.PI*2);ctx.arc(31,8,7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-20,-14);ctx.lineTo(-20,-20);ctx.lineTo(-9,-20);ctx.stroke();
  }else if(text==='玄関'){
    // 玄関ドア＋上がり框＋靴スペース
    ctx.strokeRect(-38,-28,76,56);
    ctx.beginPath();ctx.moveTo(-27,-28);ctx.lineTo(-27,23);ctx.stroke();
    ctx.beginPath();ctx.arc(-27,-28,51,Math.PI/2,0,true);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-38,17);ctx.lineTo(38,17);ctx.stroke();
    ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(-35,8);ctx.lineTo(35,8);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(-22,-2,2,0,Math.PI*2);ctx.fillStyle='#222';ctx.fill();ctx.fillStyle='#fff';
  }else if(text==='ベッド'){
    // 頭側・枕・掛け布団が分かるベッド
    ctx.strokeRect(-44,-26,88,52);
    ctx.fillStyle='#f7f7f7';ctx.fillRect(-42,-24,18,48);ctx.fillStyle='#fff';
    ctx.roundRect(-38,-17,14,28,5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-19,-26);ctx.lineTo(-19,26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-12,-18);ctx.quadraticCurveTo(10,-8,35,-14);ctx.lineTo(35,18);ctx.quadraticCurveTo(10,9,-12,17);ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-44,-30);ctx.lineTo(-44,30);ctx.moveTo(44,-30);ctx.lineTo(44,30);ctx.stroke();
  }else if(text==='手すり（横）'){
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-38,0);ctx.lineTo(38,0);ctx.stroke();
    ctx.lineWidth=2;[-28,0,28].forEach(px=>{ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,15);ctx.lineTo(px+7,15);ctx.stroke();});
  }else if(text==='手すり（縦）'){
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(0,38);ctx.stroke();
    ctx.lineWidth=2;[-28,0,28].forEach(py=>{ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(15,py);ctx.lineTo(15,py+7);ctx.stroke();});
  }else if(text==='段差'){
    ctx.beginPath();ctx.moveTo(-36,-13);ctx.lineTo(2,-13);ctx.lineTo(2,12);ctx.lineTo(36,12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-26,4);ctx.lineTo(-10,4);ctx.lineTo(-10,12);ctx.stroke();
  }else if(text==='勝手口'){
    // 細めの外部ドア＋取っ手＋外階段
    ctx.strokeRect(-24,-31,48,62);
    ctx.beginPath();ctx.moveTo(-24,-31);ctx.lineTo(24,31);ctx.stroke();
    ctx.beginPath();ctx.arc(14,0,2.5,0,Math.PI*2);ctx.fillStyle='#222';ctx.fill();ctx.fillStyle='#fff';
    ctx.beginPath();ctx.moveTo(-32,31);ctx.lineTo(32,31);ctx.moveTo(-27,38);ctx.lineTo(27,38);ctx.stroke();
  }else if(text==='スロープ'){
    // 傾斜面＋両側手すり＋進行矢印
    ctx.beginPath();ctx.moveTo(-38,20);ctx.lineTo(30,-19);ctx.lineTo(38,20);ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-36,12);ctx.lineTo(24,-24);ctx.moveTo(-31,20);ctx.lineTo(-31,7);ctx.moveTo(27,-19);ctx.lineTo(27,-31);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-15,7);ctx.lineTo(10,-8);ctx.lineTo(5,-9);ctx.moveTo(10,-8);ctx.lineTo(8,-3);ctx.stroke();
  }else if(text==='門柱'){
    // 2本の門柱＋開口
    ctx.strokeRect(-34,-27,14,54);ctx.strokeRect(20,-27,14,54);
    ctx.beginPath();ctx.moveTo(-20,17);ctx.lineTo(20,17);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-27,-27);ctx.lineTo(-27,-34);ctx.moveTo(27,-27);ctx.lineTo(27,-34);ctx.stroke();
  }else if(text==='階段'){
    ctx.strokeRect(-39,-25,78,50);for(let i=1;i<7;i++){ctx.beginPath();ctx.moveTo(-39+i*11,-25);ctx.lineTo(-39+i*11,25);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(24,0);ctx.lineTo(15,-7);ctx.moveTo(24,0);ctx.lineTo(15,7);ctx.stroke();
  }else if(text==='廊下（L字）'){
    ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-33,-22);ctx.lineTo(-33,23);ctx.lineTo(34,23);ctx.stroke();
    ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx
