<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#1976d2">
<title>ケアマネ間取り図</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#f5f7fa;color:#222}
header{background:#1976d2;color:white;padding:12px 16px;font-weight:700;font-size:20px}
.toolbar{padding:10px;display:flex;gap:7px;flex-wrap:wrap;background:white;border-bottom:1px solid #ddd}
button{border:0;border-radius:8px;padding:10px 12px;font-size:15px;background:#e8eef5;cursor:pointer}
button.primary{background:#1976d2;color:#fff} button.danger{background:#fff0f0;color:#b00020}
.help{padding:8px 12px;font-size:13px;color:#555;background:#fff}
#wrap{padding:10px;overflow:auto}
canvas{display:block;background:#fff;border:1px solid #bbb;touch-action:none;box-shadow:0 2px 8px #0001}
.note{padding:8px 12px;font-size:12px;color:#666}
</style>
</head>
<body>
<header>ケアマネ間取り図</header>
<div class="toolbar">
<button class="primary" onclick="mode='room'">部屋を描く</button>
<button onclick="mode='door'">ドア</button>
<button onclick="mode='label'">文字</button>
<button onclick="undo()">1つ戻す</button>
<button onclick="saveImage()">画像保存</button>
<button class="danger" onclick="clearAll()">全消去</button>
</div>
<div class="help">「部屋を描く」→ 画面を指でなぞるだけ。ドアや「玄関・居室・トイレ」などの文字も追加できます。</div>
<div id="wrap"><canvas id="c" width="900" height="650"></canvas></div>
<div class="note">利用者名など個人情報を入れた画像の取り扱いにはご注意ください。</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'); let mode='room',start=null,items=[];
function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return {x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}
function grid(){x.clearRect(0,0,c.width,c.height);x.strokeStyle='#edf0f2';x.lineWidth=1;for(let i=0;i<c.width;i+=25){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=0;i<c.height;i+=25){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}}
function redraw(){grid();items.forEach(a=>{x.strokeStyle='#222';x.fillStyle='#222';x.lineWidth=4;if(a.t==='room')x.strokeRect(a.x,a.y,a.w,a.h);if(a.t==='door'){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(a.x+60,a.y);x.stroke();x.beginPath();x.arc(a.x,a.y,60,0,Math.PI/2);x.stroke()}if(a.t==='label'){x.font='28px sans-serif';x.fillText(a.s,a.x,a.y)}})}
function down(e){e.preventDefault();let p=pos(e);if(mode==='label'){let s=prompt('文字を入力（例：玄関、居室、トイレ）');if(s){items.push({t:'label',x:p.x,y:p.y,s});redraw()}return}if(mode==='door'){items.push({t:'door',x:p.x,y:p.y});redraw();return}start=p}
function up(e){if(!start||mode!=='room')return;e.preventDefault();let p=pos(e);items.push({t:'room',x:start.x,y:start.y,w:p.x-start.x,h:p.y-start.y});start=null;redraw()}
c.addEventListener('mousedown',down);c.addEventListener('mouseup',up);c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchend',e=>{let t=e.changedTouches[0],r=c.getBoundingClientRect();if(start){items.push({t:'room',x:start.x,y:start.y,w:(t.clientX-r.left)*c.width/r.width-start.x,h:(t.clientY-r.top)*c.height/r.height-start.y});start=null;redraw()}},{passive:false});
function undo(){items.pop();redraw()} function clearAll(){if(confirm('全部消しますか？')){items=[];redraw()}}
function saveImage(){redraw();let a=document.createElement('a');a.download='間取り図.png';a.href=c.toDataURL('image/png');a.click()}
function resize(){let max=Math.min(window.innerWidth-20,900);c.style.width=max+'px';c.style.height=(max*650/900)+'px'} window.addEventListener('resize',resize);resize();redraw();
</script>
</body>
</html>
